services:
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${DC_GOTENBERG_PORT:-7100}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
